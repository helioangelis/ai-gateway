name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Checar sintaxe
        run: |
          for f in src/*.js scripts/*.js web/app.js; do node --check "$f"; done
      - name: Smoke test
        run: node scripts/smoke.js
